name: Test invalid scope in PR title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pull_request event payload with invalid scope
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 4,
              "title": "fix(unknown-scope): fix something",
              "labels": []
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV
          echo "GITHUB_EVENT_NAME=pull_request" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          scope_types: '["login","signup","checkout","payment",""]'
          add_label: 'false'

      - name: Assert action failed (invalid scope should be rejected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The scope "unknown-scope" is not in the allowed scope_types list.
          # The action should fail due to invalid scope.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid scope or missing PR context"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid scope 'unknown-scope'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

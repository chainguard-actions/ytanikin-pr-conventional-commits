name: Test title_regex validation failure when title does not match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pull_request event payload with title not matching regex
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 6,
              "title": "feat: add new feature without ticket",
              "labels": []
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV
          echo "GITHUB_EVENT_NAME=pull_request" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          title_regex: 'PROJECT-\d{2,5}$'
          add_label: 'false'

      - name: Assert action failed (title does not match required regex)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Title "feat: add new feature without ticket" does NOT match PROJECT-\d{2,5}$
          # The action should fail due to regex mismatch.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed because title does not match required regex"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed because title does not match regex 'PROJECT-\\d{2,5}\$'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

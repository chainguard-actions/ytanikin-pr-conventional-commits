name: Test invalid task type in PR title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pull_request event payload with invalid task type
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 2,
              "title": "invalid: this should fail validation",
              "labels": []
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV
          echo "GITHUB_EVENT_NAME=pull_request" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: 'false'

      - name: Assert action failed (invalid task type should be rejected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because "invalid" is not in the task_types list.
          # Under the harness, it may also fail due to missing PR context.
          # Either way, failure is the expected outcome.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid task type or missing PR context"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid task type 'invalid'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

name: Test invalid scope_types input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          scope_types: 'not-a-json-array'
          add_label: 'false'
      - name: Assert action fails (invalid scope_types or no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail either because scope_types is invalid JSON
          # (checked after PR context access) or because there is no pull_request
          # context under workflow_dispatch. Either way, failure is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

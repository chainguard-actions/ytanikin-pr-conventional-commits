name: Test missing task_types input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          task_types: ''
          add_label: 'false'
      - name: Assert action fails with missing task_types
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because task_types is empty/missing
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on missing task_types input"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on missing task_types input"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

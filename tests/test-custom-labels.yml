name: Test custom_labels mapping
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pull_request event payload for custom labels test
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 7,
              "title": "feat: add new feature",
              "labels": []
            },
            "repository": {
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV
          echo "GITHUB_EVENT_NAME=pull_request" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: 'true'
          custom_labels: '{"feat": "feature", "fix": "bugfix", "docs": "documentation"}'

      - name: Assert action ran (custom labels scenario)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action attempts to apply a "feature" label (mapped from "feat") to the PR.
          # Under the harness, the sentinel repo causes API calls to fail.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom labels"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness - sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
